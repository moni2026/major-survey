<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>전공 지망 조사</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        "Pretendard",
        "Noto Sans KR",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f8f4ff 0%,
          #eef8ff 100%
        );

      color: #444;
      min-height: 100vh;
      padding: 30px 15px;
    }


    /* =========================
       전체 컨테이너
    ========================= */

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }


    /* =========================
       카드
    ========================= */

    .card {
      background: rgba(255, 255, 255, 0.96);

      border-radius: 24px;

      padding: 35px 30px;

      box-shadow:
        0 10px 35px
        rgba(120, 120, 160, 0.12);
    }


    /* =========================
       제목
    ========================= */

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header .icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 28px;
      color: #555;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 14px;
      color: #888;
      line-height: 1.6;
    }


    /* =========================
       입력 영역
    ========================= */

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;

      font-size: 15px;
      font-weight: 600;

      margin-bottom: 8px;

      color: #555;
    }

    .required {
      color: #e99a9a;
      margin-left: 3px;
    }


    input,
    select {
      width: 100%;
      height: 52px;

      border: 1px solid #e5e1eb;
      border-radius: 12px;

      padding: 0 15px;

      font-size: 15px;
      color: #555;

      background: #faf9fc;

      outline: none;

      transition: all 0.2s ease;
    }


    input:focus,
    select:focus {
      border-color: #b9a7d8;

      background: #fff;

      box-shadow:
        0 0 0 3px
        rgba(185, 167, 216, 0.15);
    }


    /* =========================
       전공 선택 영역
    ========================= */

    .major-box {
      background: #f9f7fd;

      border-radius: 16px;

      padding: 20px;

      margin-top: 8px;
    }


    .major-item {
      margin-bottom: 16px;
    }


    .major-item:last-child {
      margin-bottom: 0;
    }


    .major-label {
      display: flex;

      align-items: center;

      gap: 7px;

      margin-bottom: 7px;

      font-size: 14px;
    }


    /* 순위 동그라미 */

    .rank {
      display: inline-flex;

      width: 27px;
      height: 27px;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #d9ccec;

      color: #66557e;

      font-size: 12px;
      font-weight: bold;
    }


    /* =========================
       오류 메시지
    ========================= */

    .message {
      min-height: 20px;

      margin-top: 8px;

      font-size: 13px;

      color: #d77979;

      text-align: center;
    }


    /* =========================
       제출 버튼
    ========================= */

    .submit-btn {
      width: 100%;

      height: 56px;

      border: none;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #b9a7d8,
          #9fc7df
        );

      color: white;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;

      margin-top: 15px;

      transition:
        transform 0.2s,
        box-shadow 0.2s,
        opacity 0.2s;
    }


    .submit-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 20px
        rgba(150, 140, 190, 0.25);
    }


    .submit-btn:active {
      transform: translateY(0);
    }


    /* 제출 중 */

    .submit-btn:disabled {
      cursor: not-allowed;

      opacity: 0.6;

      transform: none;

      box-shadow: none;
    }


    /* =========================
       제출 완료 영역
    ========================= */

    .success-box {
      display: none;

      margin-top: 25px;

      background: #f5fbf8;

      border: 1px solid #d9eee4;

      border-radius: 18px;

      padding: 25px;

      text-align: center;
    }


    .success-box.show {
      display: block;
    }


    .success-icon {
      font-size: 35px;

      margin-bottom: 10px;
    }


    .success-title {
      font-size: 20px;

      font-weight: 700;

      color: #638879;

      margin-bottom: 8px;
    }


    .success-text {
      font-size: 14px;

      color: #777;

      line-height: 1.6;
    }


    /* =========================
       모바일
    ========================= */

    @media (max-width: 480px) {

      body {
        padding: 15px 10px;
      }


      .card {
        padding: 25px 20px;

        border-radius: 20px;
      }


      .header h1 {
        font-size: 24px;
      }


      .header .icon {
        font-size: 36px;
      }


      .major-box {
        padding: 16px;
      }


      input,
      select {
        height: 50px;
      }

    }

  </style>
</head>


<body>

  <div class="container">

    <div class="card">


      <!-- =========================
           제목
      ========================= -->

      <div class="header">

        <div class="icon">
          🎨
        </div>

        <h1>
          전공 지망 조사
        </h1>

        <p>
          앞으로 공부하고 싶은 전공을<br>
          1지망부터 3지망까지 선택해주세요.
        </p>

      </div>


      <!-- =========================
           설문 폼
      ========================= -->

      <form id="majorForm">


        <!-- 학번 -->

        <div class="form-group">

          <label for="studentId">
            학번
            <span class="required">*</span>
          </label>

          <input
            type="text"
            id="studentId"
            placeholder="학번을 입력하세요"
            autocomplete="off"
            required
          >

        </div>


        <!-- 이름 -->

        <div class="form-group">

          <label for="studentName">
            이름
            <span class="required">*</span>
          </label>

          <input
            type="text"
            id="studentName"
            placeholder="이름을 입력하세요"
            autocomplete="off"
            required
          >

        </div>


        <!-- =========================
             전공 선택
        ========================= -->

        <div class="form-group">

          <label>
            희망 전공
            <span class="required">*</span>
          </label>


          <div class="major-box">


            <!-- 1지망 -->

            <div class="major-item">

              <div class="major-label">

                <span class="rank">
                  1
                </span>

                <span>
                  1지망
                </span>

              </div>


              <select
                id="major1"
                required
              >

                <option value="">
                  전공을 선택하세요
                </option>

                <option value="한국화">
                  한국화
                </option>

                <option value="서양화">
                  서양화
                </option>

                <option value="디자인">
                  디자인
                </option>

                <option value="디지털(영상)">
                  디지털(영상)
                </option>

                <option value="입체조형">
                  입체조형
                </option>

              </select>

            </div>


            <!-- 2지망 -->

            <div class="major-item">

              <div class="major-label">

                <span class="rank">
                  2
                </span>

                <span>
                  2지망
                </span>

              </div>


              <select
                id="major2"
                required
              >

                <option value="">
                  전공을 선택하세요
                </option>

                <option value="한국화">
                  한국화
                </option>

                <option value="서양화">
                  서양화
                </option>

                <option value="디자인">
                  디자인
                </option>

                <option value="디지털(영상)">
                  디지털(영상)
                </option>

                <option value="입체조형">
                  입체조형
                </option>

              </select>

            </div>


            <!-- 3지망 -->

            <div class="major-item">

              <div class="major-label">

                <span class="rank">
                  3
                </span>

                <span>
                  3지망
                </span>

              </div>


              <select
                id="major3"
                required
              >

                <option value="">
                  전공을 선택하세요
                </option>

                <option value="한국화">
                  한국화
                </option>

                <option value="서양화">
                  서양화
                </option>

                <option value="디자인">
                  디자인
                </option>

                <option value="디지털(영상)">
                  디지털(영상)
                </option>

                <option value="입체조형">
                  입체조형
                </option>

              </select>

            </div>


            <!-- 오류 메시지 -->

            <div
              id="errorMessage"
              class="message"
            ></div>


          </div>

        </div>


        <!-- =========================
             제출 버튼
        ========================= -->

        <button
          type="submit"
          class="submit-btn"
        >
          전공 지망 제출하기
        </button>


      </form>


      <!-- =========================
           제출 완료 메시지
      ========================= -->

      <div
        id="successBox"
        class="success-box"
      >

        <div class="success-icon">
          ✓
        </div>

        <div class="success-title">
          제출 완료
        </div>

        <div class="success-text">
          응답이 성공적으로 제출되었습니다.
        </div>

      </div>


    </div>

  </div>



  <script>


    /* =====================================================
       1. Google Apps Script 웹앱 URL
       =====================================================

   
    */

       const WEB_APP_URL =
    "https://script.google.com/macros/s/AKfycbz1uA6X6JCXshshewkPqyOwCv5t5dg1KHFrc-ZOE7FuT3rQk7_DKW7NzBcPGH9-1f2NJA/exec";



    /* =====================================================
       2. 전공 Dropdown 가져오기
       ===================================================== */

    const selects = [

      document.getElementById("major1"),

      document.getElementById("major2"),

      document.getElementById("major3")

    ];


    const errorMessage =
      document.getElementById("errorMessage");



    /* =====================================================
       3. 전공 중복 방지
       ===================================================== */

    function updateMajorOptions() {


      /*
        현재 선택된 전공들을 가져옵니다.
      */

      const selectedValues = selects

        .map(select => select.value)

        .filter(value => value !== "");



      /*
        각각의 Dropdown을 확인합니다.
      */

      selects.forEach(select => {


        const currentValue =
          select.value;


        Array.from(select.options)
          .forEach(option => {


            /*
              첫 번째 안내 문구는 항상 활성화
            */

            if (option.value === "") {

              option.disabled = false;

              return;
            }


            /*
              현재 Dropdown에서 이미 선택한 값은
              자기 자신에게서는 활성화 상태 유지
            */

            if (option.value === currentValue) {

              option.disabled = false;

            } else {

              /*
                다른 Dropdown에서 선택된 전공은
                비활성화
              */

              option.disabled =
                selectedValues.includes(option.value);

            }

          });

      });


      /*
        중복 여부 확인
      */

      const hasDuplicate =
        new Set(selectedValues).size
        !== selectedValues.length;


      if (hasDuplicate) {

        errorMessage.textContent =
          "⚠ 같은 전공을 중복해서 선택할 수 없습니다.";

      } else {

        errorMessage.textContent = "";

      }

    }



    /* =====================================================
       4. Dropdown 변경 시 실시간 검사
       ===================================================== */

    selects.forEach(select => {

      select.addEventListener(
        "change",
        updateMajorOptions
      );

    });



    /* =====================================================
       5. 제출 이벤트
       ===================================================== */

    document
      .getElementById("majorForm")
      .addEventListener(
        "submit",
        async function(event) {


          /*
            기본 폼 제출을 막습니다.
          */

          event.preventDefault();



          /* -----------------------------------------------
             입력값 가져오기
          ------------------------------------------------ */

          const studentId =
            document
              .getElementById("studentId")
              .value
              .trim();


          const name =
            document
              .getElementById("studentName")
              .value
              .trim();


          const choice1 =
            document
              .getElementById("major1")
              .value;


          const choice2 =
            document
              .getElementById("major2")
              .value;


          const choice3 =
            document
              .getElementById("major3")
              .value;



          /* -----------------------------------------------
             학번 / 이름 확인
          ------------------------------------------------ */

          if (!studentId || !name) {

            errorMessage.textContent =
              "⚠ 학번과 이름을 입력해주세요.";

            return;

          }



          /* -----------------------------------------------
             1~3지망 선택 여부 확인
          ------------------------------------------------ */

          if (
            !choice1 ||
            !choice2 ||
            !choice3
          ) {

            errorMessage.textContent =
              "⚠ 1지망, 2지망, 3지망을 모두 선택해주세요.";

            return;

          }



          /* -----------------------------------------------
             전공 중복 확인
          ------------------------------------------------ */

          const majors = [
            choice1,
            choice2,
            choice3
          ];


          if (
            new Set(majors).size
            !== majors.length
          ) {

            errorMessage.textContent =
              "⚠ 1~3지망은 서로 다른 전공을 선택해야 합니다.";

            return;

          }



          /* -----------------------------------------------
             Google Sheets로 보낼 JSON 데이터
          ------------------------------------------------ */

          const data = {

            studentId: studentId,

            name: name,

            choice1: choice1,

            choice2: choice2,

            choice3: choice3

          };



          /* -----------------------------------------------
             제출 버튼 가져오기
          ------------------------------------------------ */

          const submitButton =
            document.querySelector(
              ".submit-btn"
            );



          /* -----------------------------------------------
             제출 중에는 버튼 잠금
          ------------------------------------------------ */

          submitButton.disabled = true;

          submitButton.textContent =
            "제출 중...";



          try {


            /* =============================================
               Fetch API POST 전송
            ============================================= */

            const response =
              await fetch(
                WEB_APP_URL,
                {

                  method: "POST",

                  headers: {

                    /*
                      Google Apps Script와
                      통신하기 위한 설정
                    */

                    "Content-Type":
                      "text/plain;charset=utf-8"

                  },


                  /*
                    JavaScript 객체를
                    JSON 문자열로 변환
                  */

                  body:
                    JSON.stringify(data)

                }
              );



            /* -----------------------------------------------
               서버 응답 확인
            ------------------------------------------------ */

            if (!response.ok) {

              throw new Error(
                "서버 응답 오류"
              );

            }



            /* -----------------------------------------------
               제출 성공
            ------------------------------------------------ */

            alert(
              "응답이 성공적으로 제출되었습니다."
            );



            /* -----------------------------------------------
               폼 초기화
            ------------------------------------------------ */

            document
              .getElementById("majorForm")
              .reset();



            /* -----------------------------------------------
               전공 Dropdown 상태 초기화
            ------------------------------------------------ */

            updateMajorOptions();



            /* -----------------------------------------------
               오류 메시지 초기화
            ------------------------------------------------ */

            errorMessage.textContent = "";



            /* -----------------------------------------------
               제출 완료 박스 표시
            ------------------------------------------------ */

            document
              .getElementById("successBox")
              .classList.add("show");



            /*
              잠시 후 제출 완료 메시지 숨김

              학생이 다음 학생에게 기기를 넘겨줄 경우
              깔끔하게 사용할 수 있습니다.
            */

            setTimeout(
              function() {

                document
                  .getElementById("successBox")
                  .classList.remove("show");

              },
              4000
            );


          }


          /* -----------------------------------------------
             전송 실패
          ------------------------------------------------ */

          catch (error) {


            console.error(
              "제출 오류:",
              error
            );


            alert(
              "응답 제출 중 오류가 발생했습니다.\n\n" +
              "인터넷 연결을 확인하고 다시 시도해주세요."
            );

          }


          /* -----------------------------------------------
             제출 버튼 다시 활성화
          ------------------------------------------------ */

          finally {

            submitButton.disabled = false;

            submitButton.textContent =
              "전공 지망 제출하기";

          }

        }
      );



    /* =====================================================
       6. 페이지가 처음 열렸을 때 실행
       ===================================================== */

    updateMajorOptions();


  </script>

</body>
</html>
