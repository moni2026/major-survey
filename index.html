<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>전공 지망 조사</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        "Pretendard",
        "Noto Sans KR",
        Arial,
        sans-serif;
      background: linear-gradient(135deg, #f8f4ff, #eef8ff);
      color: #444;
      min-height: 100vh;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 35px 30px;
      box-shadow: 0 10px 35px rgba(120, 120, 160, 0.12);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header .icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 28px;
      color: #555;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 14px;
      color: #888;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #555;
    }

    .required {
      color: #e99a9a;
      margin-left: 3px;
    }

    input,
    select {
      width: 100%;
      height: 52px;
      border: 1px solid #e5e1eb;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 15px;
      color: #555;
      background: #faf9fc;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus,
    select:focus {
      border-color: #b9a7d8;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(185, 167, 216, 0.15);
    }

    .major-box {
      background: #f9f7fd;
      border-radius: 16px;
      padding: 20px;
      margin-top: 8px;
    }

    .major-item {
      margin-bottom: 16px;
    }

    .major-item:last-child {
      margin-bottom: 0;
    }

    .major-label {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .rank {
      display: inline-flex;
      width: 27px;
      height: 27px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #d9ccec;
      color: #66557e;
      font-size: 12px;
      font-weight: bold;
    }

    .message {
      min-height: 20px;
      margin-top: 8px;
      font-size: 13px;
      color: #d77979;
      text-align: center;
    }

    .submit-btn {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #b9a7d8, #9fc7df);
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 15px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(150, 140, 190, 0.25);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* 결과 화면 */
    .result {
      display: none;
      margin-top: 25px;
      background: #f5fbf8;
      border: 1px solid #d9eee4;
      border-radius: 18px;
      padding: 25px;
    }

    .result.show {
      display: block;
    }

    .result-title {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: #638879;
      margin-bottom: 20px;
    }

    .result-message {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 5px;
      border-bottom: 1px dashed #d9e5df;
      font-size: 14px;
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .result-row .title {
      color: #888;
      font-weight: 600;
    }

    .result-row .value {
      color: #444;
      font-weight: 600;
    }

    .notice {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin-top: 18px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px 10px;
      }

      .card {
        padding: 25px 20px;
        border-radius: 20px;
      }

      .header h1 {
        font-size: 24px;
      }

      .header .icon {
        font-size: 36px;
      }

      .major-box {
        padding: 16px;
      }

      input,
      select {
        height: 50px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="header">
        <div class="icon">🎨</div>
        <h1>전공 지망 조사</h1>
        <p>
          앞으로 공부하고 싶은 전공을<br>
          1지망부터 3지망까지 선택해주세요.
        </p>
      </div>


      <form id="majorForm">

        <!-- 학번 -->
        <div class="form-group">
          <label for="studentId">
            학번 <span class="required">*</span>
          </label>

          <input
            type="text"
            id="studentId"
            placeholder="학번을 입력하세요"
            required
          >
        </div>


        <!-- 이름 -->
        <div class="form-group">
          <label for="studentName">
            이름 <span class="required">*</span>
          </label>

          <input
            type="text"
            id="studentName"
            placeholder="이름을 입력하세요"
            required
          >
        </div>


        <!-- 전공 선택 -->
        <div class="form-group">

          <label>
            희망 전공 <span class="required">*</span>
          </label>

          <div class="major-box">

            <!-- 1지망 -->
            <div class="major-item">

              <div class="major-label">
                <span class="rank">1</span>
                <span>1지망</span>
              </div>

              <select id="major1" required>
                <option value="">전공을 선택하세요</option>
                <option value="한국화">한국화</option>
                <option value="서양화">서양화</option>
                <option value="디자인">디자인</option>
                <option value="디지털(영상)">디지털(영상)</option>
                <option value="입체조형">입체조형</option>
              </select>

            </div>


            <!-- 2지망 -->
            <div class="major-item">

              <div class="major-label">
                <span class="rank">2</span>
                <span>2지망</span>
              </div>

              <select id="major2" required>
                <option value="">전공을 선택하세요</option>
                <option value="한국화">한국화</option>
                <option value="서양화">서양화</option>
                <option value="디자인">디자인</option>
                <option value="디지털(영상)">디지털(영상)</option>
                <option value="입체조형">입체조형</option>
              </select>

            </div>


            <!-- 3지망 -->
            <div class="major-item">

              <div class="major-label">
                <span class="rank">3</span>
                <span>3지망</span>
              </div>

              <select id="major3" required>
                <option value="">전공을 선택하세요</option>
                <option value="한국화">한국화</option>
                <option value="서양화">서양화</option>
                <option value="디자인">디자인</option>
                <option value="디지털(영상)">디지털(영상)</option>
                <option value="입체조형">입체조형</option>
              </select>

            </div>

            <div id="errorMessage" class="message"></div>

          </div>

        </div>


        <!-- 제출 -->
        <button type="submit" class="submit-btn">
          전공 지망 제출하기
        </button>

      </form>


      <!-- 제출 결과 -->
      <div id="result" class="result">

        <div class="result-title">
          ✓ 제출이 완료되었습니다
        </div>

        <div class="result-message">
          입력한 내용을 확인해주세요.
        </div>

        <div class="result-row">
          <span class="title">학번</span>
          <span class="value" id="resultId"></span>
        </div>

        <div class="result-row">
          <span class="title">이름</span>
          <span class="value" id="resultName"></span>
        </div>

        <div class="result-row">
          <span class="title">1지망</span>
          <span class="value" id="resultMajor1"></span>
        </div>

        <div class="result-row">
          <span class="title">2지망</span>
          <span class="value" id="resultMajor2"></span>
        </div>

        <div class="result-row">
          <span class="title">3지망</span>
          <span class="value" id="resultMajor3"></span>
        </div>

        <div class="notice">
          제출해주셔서 감사합니다.
        </div>

      </div>

    </div>

  </div>


  <script>

    const selects = [
      document.getElementById("major1"),
      document.getElementById("major2"),
      document.getElementById("major3")
    ];

    const errorMessage =
      document.getElementById("errorMessage");


    /*
      1지망, 2지망, 3지망의 중복을 실시간으로 검사합니다.
      이미 선택된 전공은 다른 Dropdown에서 비활성화합니다.
    */
    function updateMajorOptions() {

      const selectedValues = selects
        .map(select => select.value)
        .filter(value => value !== "");


      selects.forEach(select => {

        const currentValue = select.value;

        Array.from(select.options).forEach(option => {

          if (option.value === "") {
            option.disabled = false;
            return;
          }

          /*
            현재 선택되어 있는 값은 자기 자신의 Dropdown에서는
            활성화 상태로 유지합니다.
          */
          if (option.value === currentValue) {
            option.disabled = false;
          } else {
            option.disabled =
              selectedValues.includes(option.value);
          }

        });

      });

      /*
        중복이 발생했을 경우 경고 메시지 표시
      */
      const hasDuplicate =
        new Set(selectedValues).size !== selectedValues.length;

      if (hasDuplicate) {
        errorMessage.textContent =
          "⚠ 같은 전공을 중복해서 선택할 수 없습니다.";
      } else {
        errorMessage.textContent = "";
      }

    }


    /*
      Dropdown 변경 시 즉시 실행
    */
    selects.forEach(select => {

      select.addEventListener("change", function() {
        updateMajorOptions();
      });

    });


    /*
      제출 처리
    */
    document
      .getElementById("majorForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();


        const studentId =
          document.getElementById("studentId").value.trim();

        const studentName =
          document.getElementById("studentName").value.trim();

        const major1 =
          document.getElementById("major1").value;

        const major2 =
          document.getElementById("major2").value;

        const major3 =
          document.getElementById("major3").value;


        /*
          모든 전공이 선택되었는지 확인
        */
        if (!major1 || !major2 || !major3) {

          errorMessage.textContent =
            "⚠ 1지망, 2지망, 3지망을 모두 선택해주세요.";

          return;
        }


        /*
          중복 검사
        */
        const majors = [major1, major2, major3];

        if (new Set(majors).size !== majors.length) {

          errorMessage.textContent =
            "⚠ 1~3지망은 서로 다른 전공을 선택해야 합니다.";

          return;
        }


        /*
          결과 화면에 입력값 표시
        */
        document.getElementById("resultId").textContent =
          studentId;

        document.getElementById("resultName").textContent =
          studentName;

        document.getElementById("resultMajor1").textContent =
          major1;

        document.getElementById("resultMajor2").textContent =
          major2;

        document.getElementById("resultMajor3").textContent =
          major3;


        /*
          결과 화면 표시
        */
        document
          .getElementById("result")
          .classList.add("show");


        /*
          제출 버튼 아래 결과 화면으로 이동
        */
        document
          .getElementById("result")
          .scrollIntoView({
            behavior: "smooth",
            block: "center"
          });

      });


    /*
      페이지 최초 실행
    */
    updateMajorOptions();

  </script>

</body>
</html>
